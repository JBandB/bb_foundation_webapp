.pv-accent { color: var(--pv-accent); font-weight: 700; }

.swatches { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
.sw { display: inline-block; width: 1rem; height: 1rem; margin-right: .375rem; border: 1px solid var(--line); border-radius: 3px; vertical-align: -.15em; }

</style>
</head>

  function logoField() {

  function readLogo(file) {

    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result);
      const problem = svgProblem(text);
      if (problem) { setError("f-logo", problem); return; }
      Object.assign(state.brand, { logoSvg: text, logoName: file.name });
      save();
      setError("f-logo", "");
      const status = document.getElementById("f-logo-status");
      if (status) status.textContent = `Gekozen: ${file.name}, ${Math.ceil(file.size / 1024)} kB.`;
      updateBrand();
      announce("Het logo is ingelezen.");
    };
    reader.onerror = () => setError("f-logo", "Het bestand kon niet worden gelezen.");

  /* Een logo is een plaatje: geen script, geen ingebedde HTML, geen event handlers. */
  function svgProblem(text) {
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    if (doc.getElementsByTagName("parsererror").length || doc.documentElement.nodeName.toLowerCase() !== "svg") return "Dit is geen geldig SVG-bestand.";
    if (doc.querySelector("script, foreignObject")) return "Het logo bevat een script of ingebedde HTML. Dat hoort niet in een logo; haal het eruit en kies het bestand opnieuw.";
    for (const el of doc.getElementsByTagName("*")) {
      for (const attr of el.attributes) if (/^on/i.test(attr.name)) return `Het logo bevat een event handler (${attr.name}). Haal die eruit en kies het bestand opnieuw.`;
    }
    return "";
  }
  /* De twee paletten volgen template/generators/palette.ts, zonder de reparatielus. */
  function palettes() {
    const c = {};
    const invalid = new Set();
    for (const [key] of COLOURS) {
      c[key] = toHex6(state.brand.colours[key]);
      if (!c[key]) { c[key] = DEFAULT_COLOURS[key]; invalid.add(key); }
    }
    const surfaceL = oklch(c.surface).l;
    const light = {
      bg: c.surface, ink: c.ink, card: surfaceL >= 0.985 ? tinted(c.surface, surfaceL - 0.03, 0.01) : "#ffffff",
      border: tinted(c.surface, Math.max(0.4, surfaceL - 0.14), 0.02), primary: c.primary, onPrimary: "#ffffff",
      accentText: c.accent, rail: tinted(c.primary, 0.27, 0.05), success: c.success, warning: c.warning, danger: c.danger, info: c.info,
    };
    const bg = tinted(c.primary, 0.13, 0.012);
    const card = tinted(c.primary, 0.17, 0.014);
    const status = (hex) => ensure(ensure(withL(hex, 0.74), bg, 4.5) || hex, card, 4.5) || withL(hex, 0.8);
    const dark = {
      bg, card, ink: tinted(c.ink, 0.95, 0.005), border: tinted(c.primary, 0.28, 0.016),
      primary: withL(c.primary, 0.76), onPrimary: tinted(c.primary, 0.14, 0.03), accent: withL(c.accent, 0.8), onAccent: tinted(c.primary, 0.14, 0.03),
      accentText: withL(c.accent, 0.76), rail: tinted(c.primary, 0.1, 0.012),
      success: status(c.success), warning: status(c.warning), danger: status(c.danger), info: status(c.info),
    };
    return { c, light, dark, invalid };
  }
  function updateBrand() {
    if (!brandRefs) return;
    const pal = palettes();
    if (logoUrl) URL.revokeObjectURL(logoUrl);
    logoUrl = state.brand.logoKind === "image" && state.brand.logoSvg ? URL.createObjectURL(new Blob([state.brand.logoSvg], { type: "image/svg+xml" })) : "";
    brandRefs.previews.replaceChildren(previewPanel("Licht", pal.light),
      state.brand.darkMode === "auto" ? previewPanel("Donker, benadering", pal.dark) : h("p", { class: "hint" }, "Alleen licht: de donkere modus wordt niet gemaakt."));
    brandRefs.list.replaceChildren(...PAIRS.map((pair) => contrastItem(pair, pal)));
  }
  function previewPanel(title, x) {
    const [radius, cardRadius] = RADII[state.brand.radius] || RADII.sharp;
    const statusLine = [["success", "Gelukt"], ["warning", "Let op"], ["danger", "Fout"], ["info", "Mededeling"]].map(([key, label]) => {
      const span = h("span", {}, label);
      span.style.color = x[key];
      return span;
    });
    const panel = h("div", { class: "pv" },
      h("div", { class: "pv-rail" }, logoUrl ? h("img", { src: logoUrl, alt: "" }) : h("span", {}, shortName() || "Korte naam")),
      h("div", { class: "pv-body" },
        h("p", { class: "pv-mode" }, title),
        h("p", {}, "Tekst op het canvas, met een ", h("span", { class: "pv-accent" }, "accent"), "."),
        h("div", { class: "pv-card" }, h("p", { class: "pv-title" }, "Een kaart"), h("p", {}, "Tekst op een kaart."), h("p", { class: "pv-status" }, statusLine), h("span", { class: "pv-btn" }, "Opslaan"))));
    const vars = { "--pv-bg": x.bg, "--pv-ink": x.ink, "--pv-card": x.card, "--pv-border": x.border, "--pv-primary": x.primary, "--pv-on": x.onPrimary, "--pv-accent": x.accentText, "--pv-rail": x.rail, "--pv-r": `${radius}px`, "--pv-rc": `${cardRadius}px` };
    for (const [name, value] of Object.entries(vars)) panel.style.setProperty(name, value);

  }
  function contrastItem([label, fg, bg, minimum, fix, darkFg, darkBg], pal) {
    if ([fg, bg, fix].some((key) => pal.invalid.has(key))) return h("li", { class: "fail" }, h("span", { class: "pair-name" }, label), h("span", {}, "Nog geen geldige kleur."));
    const colour = (key) => (key === "white" ? "#ffffff" : key === "card" ? pal.light.card : pal.c[key]);
    const ratio = contrast(colour(fg), colour(bg));
    const ok = ratio >= minimum;
    const norm = `${String(minimum).replace(".", ",")}:1`;
    const item = h("li", { class: ok ? "pass" : "fail" }, h("span", { class: "pair-name" }, label),
      h("span", {}, `Licht: ${ratioText(ratio)}, ${ok ? "haalt" : "haalt niet"} de norm van ${norm}.`));
    if (state.brand.darkMode === "auto") item.append(h("span", {}, `Donker, benadering: ${ratioText(contrast(pal.dark[darkFg], pal.dark[darkBg]))}.`));
    if (ok) return item;
    const other = fix === fg ? colour(bg) : colour(fg);
    const better = ensure(pal.c[fix], other, minimum);
    const phrase = COLOURS.find(([key]) => key === fix)[3];
    if (!better) { item.append(h("span", { class: "fix" }, "Geen voorstel mogelijk: pas de andere kleur van dit paar aan.")); return item; }
    const direction = luminance(better) < luminance(pal.c[fix]) ? "donkerder" : "lichter";
    item.append(h("span", { class: "fix" }, `Voorstel: maak ${phrase} ${direction}. ${better} haalt ${ratioText(contrast(better, other))}.`),
      h("button", { type: "button", class: "small", onclick: () => applyColour(fix, better) }, `Gebruik ${better} voor ${phrase}`));

  }

  /* De uitvoer: docs/PROJECTPLAN.md, met de twaalf kopjes uit de seed. */
  function buildPlan() {
    const p = state.project;
    const c = state.content;
    const hint = (n) => `_${HINTS[n - 1]}_`;
    const or = (text, n) => (t(text) ? t(text) : hint(n));
    const lines = [`# Projectplan: ${t(p.name)}`, "",
      `Opgesteld op ${longToday()} voor ${t(p.organisation)}. Dit is het document waar alles uit`,
      "volgt: Claude Code leidt er de specificatie, het datamodel, de rechten en de schermen uit af. Schrijf",
      "in gewone taal, in zelfstandige naamwoorden en werkwoorden, en zeg wat er moet gebeuren en niet hoe",
      "het gebouwd wordt. Handleiding 10 (`docs/handleiding/10-projectplan-schrijven.md`) legt per kopje",
      "uit wat een goed antwoord is, met voorbeelden. Vervang de cursieve aanwijzingen door je eigen tekst."];
    const section = (n, ...body) => lines.push("", `## ${HEADINGS[n - 1]}`, "", ...body);
    const exits = state.phases.map((ph, i) => (t(ph.exit) ? `- **Fase ${i + 1}${t(ph.name) ? `, ${inline(ph.name)}` : ""}:** ${inline(ph.exit)}` : "")).filter(Boolean);
    const complete = state.roles.every((r) => t(r.who) && (t(r.may) || r.admin));
    const count = int(state.people.count);
    const external = state.people.audience === "external";

    section(1, `**Wat het is:** ${t(p.description)}`, "", or(c.why, 1));
    const success = [t(c.success), exits.join("\n")].filter(Boolean);
    section(2, ...(success.length ? success.flatMap((part, i) => (i ? ["", part] : [part])) : [hint(2)]));
    section(3, ...(complete ? [] : [hint(3), ""]), "| Rol | Wie | Mag | Mag niet |", "|---|---|---|---|",
      ...state.roles.map((r) => `| ${cell(r.nl)} (\`${r.value.trim()}\`) | ${cell(r.who)} | ${cell(r.may) || (r.admin ? "alles, ook Beheer" : "")} | ${cell(r.mayNot)} |`),
      "", `${count ? `Verwacht aantal gebruikers: ongeveer ${count}.` : "Het aantal gebruikers is nog niet geschat."} ${external ? `Ook mensen van buiten de organisatie, met een eigen account${provider() === "entra" ? " als gast in de tenant" : ""}.` : "Alleen mensen van de organisatie."}`);
    section(4, or(c.concepts, 4));
    section(5, or(c.processes, 5));
    section(6, or(c.rules, 6));
    const links = [`- **Inloggen:** ${loginText()}.`];
    if (has("messaging")) links.push(`- **Mail en meldingen** (module messaging): ${transport() === "graph" ? "via Microsoft Graph, uit een gedeelde postbus" : "via SMTP bij een mailaanbieder"}${state.modules.teams ? ", en meldingen naar een Teams-kanaal via een webhook" : ""}.`);
    if (has("jobs")) links.push("- **Achtergrondwerk** (module jobs): elke schrijfactie naar buiten gaat via een wachtrij, met een sleutel die dubbel werk voorkomt.");
    if (has("files")) links.push(`- **Bestanden** (module files): opslag in Azure Blob Storage${t(state.modules.retention) ? `; bewaartermijn: ${bare(state.modules.retention)}` : ""}.`);
    section(7, links.join("\n"), "", "_Vul aan met wat er verder van buiten komt of naar buiten gaat: per koppeling de richting, hoe vaak, en wat als het stuk is._");
    section(8, or(c.notBuilding, 8));
    section(9, ...state.phases.flatMap((ph, i) => [`### Fase ${i + 1}${t(ph.name) ? `: ${inline(ph.name)}` : ""}`, "",
      `- **Wat erin zit:** ${inline(ph.contents) || "_nog in te vullen_"}`,
      `- **Klaar als:** ${inline(ph.exit) || "_nog in te vullen_"}`,
      `- **Handwerk buiten de code:** ${inline(ph.manual) || "_nog in te vullen_"}`, ""]));
    section(10, ...conditions());
    const questions = openQuestions();
    section(11, ...(questions.length ? [questions.map((q, i) => `- **V${i + 1}:** ${q}`).join("\n"), "", "_Vul aan met wat je verder nog niet weet, en zet bij elke vraag wie het antwoord heeft._"] : [hint(11)]));
    section(12, "| Datum | Wijziging | Waarom |", "|---|---|---|", `| ${longToday()} | Eerste versie, uit de wizard. | |`);
    return `${lines.join("\n").replace(/\n{3,}/g, "\n\n").trimEnd()}\n`;
  }
  /* Kopje 10: accounts, budget, bewaartermijn, taal en huisstijl. */
  function conditions() {
    const p = state.project;
    const b = state.brand;
    const total = int(state.budget.total);
    const commercial = { yes: "ja; Vercel Pro zodra het live is, Hobby tijdens het bouwen.", no: "nee; Hobby kan voorlopig volstaan, met een cron die hoogstens één keer per dag draait." }[state.commercial]
      || "_nog te bepalen: dat beslist of Vercel Hobby volstaat of Pro nodig is._";
    const retention = has("files") && t(state.modules.retention) ? `bestanden: ${bare(state.modules.retention)}. ` : "";
    return [
      `- **Eigenaar:** ${inline(p.owner) || "_nog in te vullen_"}`,
      `- **Taal van de interface:** ${p.uiLanguage === "en" ? "Engels" : "Nederlands"}; de documentatie is altijd Nederlands. Tijdzone: ${t(p.timezone)}.`,
      `- **Commercieel gebruik:** ${commercial}`,
      `- **Budget:** ${total !== null ? `${total} euro per maand, verdeeld zoals in de tabel hieronder.` : "_nog in te vullen: wat mag het per maand kosten, en bij welke dienst staat het plafond?_"}`,
      `- **Bewaartermijnen en privacy:** ${retention}_Welke gegevens zijn gevoelig, wie mag ze zien, en hoe lang bewaren we ze?_`,
      `- **Huisstijl:** korte naam "${shortName()}", hoofdkleur \`${toHex6(b.colours.primary)}\`, accentkleur \`${toHex6(b.colours.accent)}\`, donkere modus ${b.darkMode === "auto" ? "automatisch" : "uit"}, ${b.radius === "soft" ? "zachte" : "strakke"} hoeken, ${b.logoKind === "image" ? "eigen logo in `public/brand/logo.svg`" : "woordmerk"}. Alle kleuren staan in \`project.config.json\`.`,
      "", "**Accounts**", "", "| Dienst | Bestaat al | Van | Beheerder |", "|---|---|---|---|", ...accountRows(),
      "", "**Budget per dienst**", "", "| Dienst | Plan | Waar het plafond staat | Deel van het budget |", "|---|---|---|---|", ...budgetRows(),
    ];
  }
  function accountRows() {
    return services().map((key) => {
      const a = state.accounts[key];
      const exists = key === "m365" || a.exists === "yes" ? "ja" : a.exists === "no" ? "nee" : "";
      const owner = key === "m365" || a.owner === "organisation" ? "de organisatie" : a.owner === "personal" ? "persoonlijk" : "";
      return `| ${SERVICES[key].name} | ${exists} | ${owner} | ${cell(a.admin)} |`;
    });
  }
  function budgetRows() {
    const total = int(state.budget.total);
    const rows = services().map((key) => {
      const share = int(state.budget.split[key]);
      return `| ${SERVICES[key].name} | ${planOf(key)} | ${SERVICES[key].ceiling} | ${share === null ? "" : `${share} euro`} |`;
    });
    rows.push(`| **Totaal** | | | ${total === null ? `${usedBudget()} euro` : `${usedBudget()} van ${total} euro`} |`);
    return rows;
  }
  /* Kopje 11: de vragen die in de wizard open bleven. */
  function openQuestions() {
    const questions = [];
    if (!t(state.project.owner)) questions.push("Wie is de eigenaar van het project, de persoon die bij twijfel beslist?");
    if (int(state.people.count) === null) questions.push("Hoeveel mensen gaan het ongeveer gebruiken?");
    if (!state.commercial) questions.push("Is het gebruik commercieel? Dat beslist of Vercel Hobby voorlopig volstaat of Pro nodig is zodra het live is.");
    if (int(state.budget.total) === null) questions.push("Wat mag het per maand kosten, en bij welke dienst staat het plafond?");
    for (const key of services()) if (!t(state.accounts[key].admin)) questions.push(`Wie is de beheerder van ${SERVICES[key].name}?`);
    if (has("files") && !t(state.modules.retention)) questions.push("Hoe lang bewaren we de bestanden, en vallen ze onder een bewaarplicht?");
    return questions;
  }

  /* De uitvoer: docs/handleiding/00-checklist-<slug>.md, het stramien met alleen wat geldt. */
  function buildChecklist() {
    const p = state.project;
    const entra = provider() === "entra";
    const total = int(state.budget.total);
    const slug = p.slug.trim();
    const github = state.accounts.github;
    const box = (done, text) => `- [${done ? "x" : " "}] ${text}`;
    const lines = [`# Checklist voor ${t(p.name)}: accounts, toegang en kosten`, "",
      `De persoonlijke versie van \`docs/handleiding/00-checklist.md\` voor ${t(p.name)} (\`${slug}\`), gemaakt met de wizard op ${longToday()}. Alleen de onderdelen die voor dit project gelden staan erin. Vink af wat gedaan is en houd de tabellen onderaan bij. Geen geheimen in dit bestand: het staat in git.`,
      "", "## Voordat je begint", "",
      t(p.owner) ? box(true, `De eigenaar is ${bare(p.owner)}; één persoon beslist.`) : box(false, "Je weet wie de eigenaar van het project is (één persoon beslist)."),
      entra ? box(true, "Er is een Microsoft 365-tenant waar een beheerder een app mag registreren: de inlog gaat via Microsoft (handleiding 05).")
        : box(true, "Er is geen Microsoft 365-tenant waar een beheerder een app mag registreren: eigen accounts met wachtwoord (handleiding 05b)."),
      total !== null ? box(true, `Het budget is ${total} euro per maand, verdeeld in de tabel Budget onderaan (handleiding 30).`) : box(false, "Je hebt een budget per maand afgesproken en weet bij welke dienst het plafond staat (handleiding 30)."),
      "", "## Accounts en beheerders", "", "| Dienst | Bestaat al | Van | Beheerder |", "|---|---|---|---|", ...accountRows()];
    if (services().some((key) => key !== "m365" && state.accounts[key].owner === "personal")) lines.push("", "Een persoonlijk account is niet overdraagbaar. Zet het onder een organisatie of team voordat er echte gebruikers zijn.");
    lines.push("", "## GitHub (handleiding 02)", "",
      box(github.exists === "yes" && github.owner === "organisation", "Een organisatie, geen persoonlijk account: een persoonlijk account is niet overdraagbaar."),
      box(false, "Tweestapsverificatie verplicht voor alle leden van de organisatie."),
      box(false, `De repo \`${slug}\` aangemaakt uit het template, **privé**.`),
      box(false, "Dependabot alerts en secret scanning aan (Settings, Code security)."),
      box(false, "Actions: workflow permissions op alleen-lezen; de uitgavenlimiet voor Actions op nul."),
      box(false, "Het gratis plan heeft geen branch protection op een privé-repo: de CI is advies. Werk daarom altijd via een pull request (werkwijze, sectie 10). Wil je het slot, dan is dat GitHub Team."),
      "", "## Vercel (handleiding 03)", "",
      box(false, `Een team, geen persoonlijk account; het project \`${slug}\` geïmporteerd uit de repo.`),
      box(false, "Functieregio Frankfurt (eu-central-1), bij de database."),
      box(false, vercelLine()),
      box(false, "Deployment Protection aan voor previews."),
      box(false, "De variabelen gezet (handleiding 06), met Sensitive aan bij elk geheim."),
      "", "## Neon (handleiding 04)", "",
      box(false, "Een project in Frankfurt, gratis plan tot het niet meer past."),
      box(false, "Een dev-branch naast de productiebranch; preview-branches per pull request aan."),
      box(false, "`PRODUCTION_DB_ENDPOINT` in Vercel, zodat een preview nooit op productie migreert."),
      box(false, "Scale to zero en autosuspend op de kortste tijd; history retention op wat je nodig hebt."),
      box(false, "Je weet waar het herstelpunt (PITR) staat en hoe lang het terugkijkt."), "");
    if (entra) {
      lines.push("## Inloggen met Microsoft (handleiding 05 en 11)", "",
        box(false, "De app-registratie met de redirect-URI's van lokaal en productie."),
        box(false, `De app roles met exact de waarden uit \`project.config.json\`: ${state.roles.map((r) => `\`${r.value.trim()}\``).join(", ")}.`),
        box(false, "\"Assignment required\" op Yes, en de rollen toegewezen aan de eerste mensen."),
        box(false, "De vervaldatum van het client secret in de tabel hieronder, met een herinnering een maand ervoor."));
      if (state.people.audience === "external") lines.push(box(false, "Mensen van buiten de organisatie uitgenodigd als gast in de tenant en toegewezen aan hun rol."));
    } else {
      lines.push("## Inloggen met wachtwoord (handleiding 05b)", "",
        box(false, "De eerste beheerder uitgenodigd met `pnpm invite` en tweestapsverificatie ingesteld."),
        box(false, "Afgesproken wie een account mag uitnodigen en wie bij een vermoeden van misbruik ingrijpt."), "",
        `Tweestapsverificatie is verplicht voor ${MFA_TEXT[p.mfa]} (\`auth.password.mfaRequiredFor\` is \`${p.mfa}\`).${p.mfa === "nobody" ? " Overweeg het voor beheerders verplicht te maken." : ""}`);
    }
    if (has("messaging")) {
      lines.push("", "## Mail en meldingen (module messaging)", "",
        transport() === "graph" ? box(false, "Transport Graph: een gedeelde postbus met `Mail.Send` en een ApplicationAccessPolicy (handleiding 20).")
          : box(false, `Transport SMTP: een aanbieder met SPF en DKIM op het afzenderdomein${domainOf(p.mailDomain) ? ` \`${domainOf(p.mailDomain)}\`` : ""} (handleiding 20b).`),
        box(false, "Eén proefmail verstuurd met `pnpm mail:test`."));
      if (state.modules.teams) lines.push(box(false, "De webhook van het Teams-kanaal, getest met `pnpm teams:test` (handleiding 21)."));
    }
    if (has("files")) {
      lines.push("", "## Bestanden (module files, handleiding 22)", "");
      if (state.accounts.azure.exists !== "yes") lines.push(box(false, "Een Azure-abonnement geregeld waar de opslag in kan."));
      lines.push(box(false, "Een storage account in een EU-regio, een privécontainer, een SAS-token met Read, Create en Write en een vervaldatum van hoogstens een jaar."),
        box(false, "De vervaldatum in `BLOB_SAS_EXPIRES` én in de tabel hieronder."),
        box(false, `Een bewaarbeleid op de container als de bestanden onder een bewaarplicht vallen.${t(state.modules.retention) ? ` Bewaartermijn volgens het plan: ${bare(state.modules.retention)}.` : ""}`));
    }
    lines.push("", "## Lokaal werken (handleiding 07)", "",
      box(false, "`vercel env pull .env.local`, `AUTH_DEV_LOGIN=1` erbij, `pnpm install`, `pnpm db:status`."),
      box(false, "`.env.local` staat niet in `git status`."),
      "", "## Eerste deploy en rooktest (handleiding 08)", "",
      box(false, "De eerste deploy naar productie slaagt en `pnpm smoke:prod` is groen."),
      box(false, "Je kunt inloggen en ziet de versie linksonder in de rail."),
      "", "## Terugkerende controles", "",
      box(false, "**Wekelijks**: Beheer, Systeem is groen."),
      box(false, "**Maandelijks**: de kosten per dienst tegen het plafond; de tabel Vervaldata nagelopen."),
      box(false, "**Jaarlijks**: `public/.well-known/security.txt` en de lijst met accounts nagelopen."),
      "", "## Vervaldata", "", "| Wat | Waar | Verloopt op | Herinnering gezet |", "|---|---|---|---|");
    if (entra) lines.push("| Client secret van de app-registratie | Entra | | |");
    if (has("files")) lines.push("| SAS-token van de bestandsopslag | Azure | | |");
    if (has("messaging") && transport() === "smtp") lines.push("| Wachtwoord of app-wachtwoord van de mailaanbieder | | | |");
    lines.push("", "## Budget", "", "| Dienst | Plan | Waar het plafond staat | Deel van het budget |", "|---|---|---|---|", ...budgetRows());
    return `${lines.join("\n").replace(/\n{3,}/g, "\n\n")}\n`;
  }
  function vercelLine() {
    if (state.commercial === "yes") return "Pro met Spend Management zodra het live is: het gebruik is commercieel, en dat staat het Hobby-plan niet toe. Tijdens het bouwen kan Hobby.";
    if (state.commercial === "no") return "Hobby kan voorlopig volstaan, want het gebruik is niet commercieel. Een cron draait daar hoogstens één keer per dag; Pro met Spend Management zodra dat niet meer past.";
    return "Hobby tijdens het bouwen; Pro met Spend Management zodra er echte gebruikers zijn (het Hobby-plan staat commercieel gebruik niet toe en een cron draait er maar één keer per dag).";
  }

  /* De uitvoer: de startprompt voor Claude Code. */
  function buildPrompt() {
    const p = state.project;
    const slug = p.slug.trim();
    const files = ["`project.config.json`", "`docs/PROJECTPLAN.md`", `\`docs/handleiding/00-checklist-${slug}.md\``];
    if (state.brand.logoKind === "image") files.push("`public/brand/logo.svg`");
    return [
      `Dit is de eerste ronde van ${t(p.name)} (\`${slug}\`), een project uit het template BB_foundation_webapp. De uitvoer van de wizard staat in de repo: ${files.join(", ")}.`,
      "",
      "1. Lees eerst `CLAUDE.md`, `docs/WERKWIJZE.md`, `project.config.json`, `docs/PROJECTPLAN.md`, `docs/patronen/README.md` en `docs/lessen/README.md`.",
      "2. Draai `pnpm template:apply` en volg de slottekst. Weigert apply omdat de werkmap niet schoon is, stop dan en zeg het me: git doe ik zelf.",
      "3. Leid uit het projectplan een eerste `docs/SPEC.md` af: het datamodel, de kernflows, de rechtenmatrix in `lib/auth/actions.ts` en `lib/auth/matrix.ts`, de roadmap met de fasen in `docs/ROADMAP.md`, en de besluiten die uit het plan volgen als D13 en verder, elk met de prijs erbij. Lever dat op als versie v0.02. Bouw verder nog niets: geen schermen, geen tabellen, geen migraties.",
      "4. Staat er in het plan nog een cursieve aanwijzing, dan is dat kopje niet ingevuld. Vul het niet stil in: doe een aanname, zeg welke, en zet hem bij de open vragen.",
      "5. Lever op met de open vragen (genummerd, met wie het antwoord heeft), het handwerk buiten de code (met de handleiding erbij), en wat je bewust open liet en waarom.",
      "",
      "Git doe ik zelf: geen commits, branches of pushes.",
      "",
    ].join("\n");
  }

  /* Start. */
  function buildTimezoneList() {
    let zones = [];
    try { zones = Intl.supportedValuesOf("timeZone"); } catch { zones = []; }
    if (!zones.length) zones = ["Europe/Amsterdam", "Europe/Brussels", "Europe/Berlin", "Europe/London", "Europe/Paris", "UTC"];
    document.body.append(h("datalist", { id: "tz-list" }, zones.map((zone) => h("option", { value: zone }))));
  }
  state.resume = state.step || state.maxStep;
  state.step = 0;
  buildTimezoneList();
  render(false);
})();
</script>
</body>
</html>
