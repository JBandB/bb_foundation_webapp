# template-owned (module core). Wordt overschreven door pnpm template:update; wijzig dit bestand niet.
# Dependabot: wekelijks een pull request voor wat bijgewerkt kan worden, en meteen een zodra er een
# advisory op een afhankelijkheid staat.
#
# Alleen versie-updates staan hier. De meldingen (Dependabot alerts) en de security-updates zijn een
# instelling op de repo (Settings, Code security): zet die met de hand aan (handleiding 02).
#
# Majors die alleen samen en bewust omhoog gaan, blijven buiten: typescript (typescript-eslint loopt
# achter), eslint (ESLint 10 breekt eslint-plugin-react), next met eslint-config-next, en react met
# react-dom. Zie pnpm-workspace.yaml.
#
# Een versie-update wacht zeven dagen na publicatie (cooldown): een pakket dat net is uitgebracht kan
# kwaadaardig of instabiel zijn, en dat blijkt meestal in de eerste dagen. Een security-update valt
# daar niet onder en komt meteen. De actions in de CI staan op een commit-SHA; Dependabot werkt die en
# het versiecommentaar bij.
#
# Een pull request van Dependabot gaat naar main en dus om release/next, de versie en de release notes
# heen: niet los mergen, maar meenemen in een gewone ronde (docs/WERKWIJZE.md). Een workflow die
# Dependabot start, krijgt geen repository-secrets.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # Eén pull request per week voor alles wat minor of patch is: te overzien en te testen.
      minor-en-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      # Alle actions in één pull request, ook een nieuwe major: dat is meestal alleen een nieuwere
      # Node-runtime, en de CI op die pull request laat zien of het werkt.
      actions:
        patterns:
          - "*"
