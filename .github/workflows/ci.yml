# template-owned (module core). Wordt overschreven door pnpm template:update; wijzig dit bestand niet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Alleen lezen: geen workflow hier hoeft iets naar de repo te schrijven.
permissions:
  contents: read

# Elke action staat op een volledige commit-SHA met de versie als commentaar, en niet op een tag als
# `@v4`: een tag kan de eigenaar stil laten wijzen naar andere code, zoals bij de aanvallen op
# trivy-action en kics-github-action. Dependabot (github-actions) werkt de SHA en het commentaar samen
# bij. Een nieuwe action pin je net zo: `git ls-remote --tags <repo>` geeft de commit achter de tag
# (bij een geannoteerde tag de regel die op ^{} eindigt).

jobs:
  quality:
    name: Typecheck, lint, tests en build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: De projectconfiguratie is geldig
        run: pnpm template:validate

      - name: Lint, inclusief de huisregels
        run: pnpm lint

      # De unittests hebben geen database nodig en draaien in seconden.
      - name: De unittests
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migraties, drift en contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Elke migratie bestaat, heeft een terugweg en is niet gewijzigd nadat hij op main stond.
      # Zonder database, dus dit kan op elke pull request.
      - name: Elke migratie heeft een terugweg
        run: pnpm check:migrations

      # Het schema en de snapshot in migrations/meta lopen gelijk. drizzle-kit generate leest alleen
      # bestanden; de connectiestring wijst naar een adres waar niets luistert.
      - name: Het schema loopt niet voor op de migraties
        run: pnpm check:drift

      # Het project klopt nog met zijn template.lock.json: geen owned bestand gewijzigd, de gegenereerde
      # bestanden actueel, de gedeelde bestanden een vast punt van hun patcher.
      - name: Het template is intact
        run: pnpm template:verify

      # Rekent de tokens uit app/theme.css en app/project.css na in beide modi. Een donkere
      # modus ziet er altijd goed uit en is bijna nooit leesbaar; dat verschil zie je niet,
      # je rekent het.
      - name: Het contrast haalt de norm in licht en donker
        run: pnpm check:contrast

  security:
    name: Kwetsbaarheden en geheimen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Alleen wat naar productie gaat, en alleen vanaf high: een moderate advisory op een
      # devDependency is onderhoud voor de wekelijkse update van Dependabot, geen reden om een pull
      # request te blokkeren. Een onvermijdelijke melding gaat met de reden erbij in
      # pnpm.auditConfig.ignoreCves en in de release notes.
      - name: Bekende kwetsbaarheden in de productieafhankelijkheden
        run: pnpm audit --prod --audit-level=high

      # secretlint met de aanbevolen regels; .secretlintignore zegt wat hij overslaat. Een vals alarm
      # krijgt // secretlint-disable-next-line met de reden op de regel erboven.
      - name: Geen geheimen in de code
        run: pnpm check:secrets

  # Statische analyse met Semgrep CE: de standaardregels plus die voor TypeScript. Advies en geen
  # poort tot een run hier beoordeeld en groen is: de echte bevindingen gerepareerd, een vals alarm
  # per regel uit met // nosemgrep: <regel-id> en de reden op de regel erboven. Daarna gaat
  # continue-on-error naar false. De e2e-tests vallen erbuiten: testcode met vaste waarden.
  semgrep:
    name: Statische analyse (advies)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Semgrep
        run: semgrep scan --config p/default --config p/typescript --error --exclude node_modules --exclude .next --exclude playwright-report --exclude test-results --exclude e2e
